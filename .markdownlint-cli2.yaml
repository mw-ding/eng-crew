# Lenient markdownlint config for prose-heavy docs.
config:
  default: true
  MD013: false # line length
  MD024:
    siblings_only: true # allow repeated headings in different sections
  MD033: false # inline HTML (hidden crew markers use HTML comments)
  MD041: false # first line need not be a top-level heading (templates)
  MD060: false # table column style
globs:
  - "**/*.md"
ignores:
  - "node_modules/**"
