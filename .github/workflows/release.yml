name: release

# Release gate (docs/protocol.md gate registry). The CHANGELOG cut lands
# first as a normal crew PR (scripts/changelog-cut.py); this workflow never
# commits. `validate` is read-only. `publish` runs only on a dispatch with
# dry_run=false, behind the `release` environment, and writes only the
# annotated tag vX.Y.Z and its GitHub Release. Pull requests touching the
# release files run `validate` as a dry run on a simulated cut.
# crew:sensitive (#184): changes need the owner's per-change merge-ok.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (no v); must be the top CHANGELOG section"
        required: true
        type: string
      dry_run:
        description: "Validate only: no tag, no release"
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/changelog-cut.py
      - scripts/release-check.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || '999.0.0-dryrun' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "::error::dispatch release.yml on main, not $GITHUB_REF" && exit 1
      - name: Repo guard and every scripts/test-*.py (render parity included)
        run: |
          python3 scripts/check-repo.py
          for t in scripts/test-*.py; do echo "== $t"; python3 "$t"; done
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
      - name: Simulate the cut (pull request dry run)
        if: github.event_name == 'pull_request'
        run: python3 scripts/changelog-cut.py "$VERSION" --dry-run > "$RUNNER_TEMP/CHANGELOG.md"
      - name: CHANGELOG section, tag order, release notes
        env:
          CHANGELOG: ${{ github.event_name == 'pull_request' && format('{0}/CHANGELOG.md', runner.temp) || 'CHANGELOG.md' }}
        run: |
          python3 scripts/release-check.py "$VERSION" --file "$CHANGELOG" \
            --notes "$RUNNER_TEMP/notes.md" --tags $(git tag --list 'v*')
          cat "$RUNNER_TEMP/notes.md"
      - name: Bundle (placeholder)
        run: echo "TODO(#236) build eng-crew-$VERSION.tar.gz and SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      # Stopgap while the environment cannot require reviewers (private repo
      # on GitHub Free): only the owner login in RELEASE_OWNER may publish.
      - name: Owner only
        env:
          OWNER: ${{ vars.RELEASE_OWNER }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
        run: |
          if [ -z "$OWNER" ] || [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGER" != "$OWNER" ]; then
            echo "::error::publish refused: actor is not the RELEASE_OWNER variable"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Tag the validated SHA and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" \
            -f message="eng-crew v$VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag"
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file notes.md $pre
