name: release

# Release gate (docs/protocol.md gate registry). The CHANGELOG cut lands
# first as a normal crew PR (scripts/changelog-cut.py); this workflow never
# commits. `prepare` refuses early when a publishing run's actor is not
# RELEASE_OWNER. `validate` is read-only and runs release-specific checks
# only; ci.yml owns the suite. `ci-gate` waits for the green ci.yml push run
# at the same SHA and fails closed. `publish` needs both, then verifies owner
# approval before writing the annotated tag, Release and issue notice.
# CHANGELOG PRs validate the real cut; other release-file PRs validate a
# simulated cut.
# crew:sensitive (#184): changes need the owner's per-change merge-ok.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (no v); must be the top CHANGELOG section"
        required: true
        type: string
      dry_run:
        description: "Validate only: no tag, no release"
        type: boolean
        default: true
  pull_request:
    paths:
      - CHANGELOG.md
      - .github/workflows/release.yml
      - scripts/changelog-cut.py
      - scripts/release-check.py
      - scripts/release-trigger.py
      - dev/tests/scripts/test-release-trigger.py
      - scripts/release-bundle.py
      - dev/tests/scripts/test-release-bundle.py

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.cut.outputs.version }}
      ready: ${{ steps.cut.outputs.ready }}
      simulated: ${{ steps.cut.outputs.simulated }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect the cut
        id: cut
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ]; then
            python3 scripts/release-trigger.py detect --skip-invalid
          elif git diff --name-only "$BASE_SHA" HEAD -- CHANGELOG.md | grep -q '^CHANGELOG.md$'; then
            python3 scripts/release-trigger.py detect
          else
            echo 'version=999.0.0-dryrun' >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'simulated=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Release actor is RELEASE_OWNER
        if: steps.cut.outputs.ready == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
        env:
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
        run: python3 scripts/release-trigger.py actor

  ci-gate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Green ci.yml push run at this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-trigger.py ci-gate --wait 2400 --interval 30

  validate:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dispatch only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: echo "::error::dispatch release.yml on main, not $GITHUB_REF" && exit 1
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
      - name: Simulate the cut (pull request dry run)
        if: needs.prepare.outputs.simulated == 'true'
        run: python3 scripts/changelog-cut.py "$VERSION" --dry-run > "$RUNNER_TEMP/CHANGELOG.md"
      - name: CHANGELOG section, tag order, release notes
        env:
          CHANGELOG: ${{ needs.prepare.outputs.simulated == 'true' && format('{0}/CHANGELOG.md', runner.temp) || 'CHANGELOG.md' }}
        run: |
          python3 scripts/release-check.py "$VERSION" --file "$CHANGELOG" \
            --notes "$RUNNER_TEMP/notes.md" --tags $(git tag --list 'v*')
          cat "$RUNNER_TEMP/notes.md"
      - name: Bundle and SHA256SUMS at the validated SHA
        run: |
          python3 scripts/release-bundle.py "$VERSION" --out dist --ref "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/

  publish:
    needs: [prepare, validate, ci-gate]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      pull-requests: read
      issues: write
    steps:
      # Stopgap while the environment cannot require reviewers (private repo
      # on GitHub Free): only the owner login in RELEASE_OWNER may publish.
      - uses: actions/checkout@v4
      - name: Owner and cut PR approval
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
        run: python3 scripts/release-trigger.py authorize
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Tag the validated SHA and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="v$VERSION" \
            -f message="eng-crew v$VERSION" -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$tag"
          pre=""; case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file notes.md $pre \
            "dist/eng-crew-$VERSION.tar.gz" dist/SHA256SUMS
      - name: Notify and close the release issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES: ${{ steps.approval.outputs.issues }}
        run: |
          url=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          for issue in $ISSUES; do
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Released v$VERSION: $url"
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY"
          done
