name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs. Main runs one group per commit and
# never cancels: release.yml publishes only after ci.yml is green at the cut SHA.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pinned lychee release asset and its sha256. A transient download error
    # is retried with backoff; an exhausted retry or a bad checksum fails.
    env:
      LYCHEE_VERSION: "0.24.2"
      LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
    steps:
      - uses: actions/checkout@v4
      - name: Cache the pinned lychee binary
        id: lychee-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/lychee
          key: lychee-${{ env.LYCHEE_VERSION }}-${{ env.LYCHEE_SHA256 }}
      - name: Install lychee (retry with backoff, checksum verified)
        if: steps.lychee-cache.outputs.cache-hit != 'true'
        run: |
          url="https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tarball="$RUNNER_TEMP/lychee.tar.gz"
          for attempt in 1 2 3 4 5; do
            curl -fsSL --connect-timeout 20 --max-time 60 -o "$tarball" "$url" && break
            if [ "$attempt" = 5 ]; then
              echo "::error::lychee $LYCHEE_VERSION download failed after 5 attempts: $url"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          if ! echo "$LYCHEE_SHA256  $tarball" | sha256sum -c --quiet -; then
            echo "::error::lychee $LYCHEE_VERSION checksum mismatch, expected sha256 $LYCHEE_SHA256"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/lychee-x" "$HOME/.local/lychee"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/lychee-x"
          bin=$(find "$RUNNER_TEMP/lychee-x" -type f -name lychee -print -quit)
          if [ -z "$bin" ]; then
            echo "::error::lychee $LYCHEE_VERSION binary not found in $url"
            exit 1
          fi
          mv "$bin" "$HOME/.local/lychee/lychee"
      - name: Check relative links (offline)
        run: |
          "$HOME/.local/lychee/lychee" --offline --no-progress --include-fragments './**/*.md'

  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG fragment for PR changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check-changelog-pr.py --base "$PR_BASE" --head "$PR_HEAD" ${PR_NUMBER:+--pr "$PR_NUMBER"}
      - name: Repo check (secrets, required docs/sections, relative links)
        env:
          DENYLIST_CONTENT: ${{ secrets.CREW_DENYLIST }}
        run: |
          if [ -n "$DENYLIST_CONTENT" ]; then
            export CREW_DENYLIST="$RUNNER_TEMP/crew-denylist"
            trap 'rm -f "$CREW_DENYLIST"' EXIT
            umask 077
            printf '%s\n' "$DENYLIST_CONTENT" > "$CREW_DENYLIST"
          fi
          unset DENYLIST_CONTENT
          python3 scripts/check-repo.py
      - name: Test suite (every dev/tests/*/test-*.py once, in parallel)
        run: python3 scripts/run-tests.py
