name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG fragment for PR changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-changelog-pr.py --base "$PR_BASE" --head "$PR_HEAD"
      - name: Repo check (secrets, required docs/sections, relative links)
        env:
          DENYLIST_CONTENT: ${{ secrets.CREW_DENYLIST }}
        run: |
          if [ -n "$DENYLIST_CONTENT" ]; then
            export CREW_DENYLIST="$RUNNER_TEMP/crew-denylist"
            trap 'rm -f "$CREW_DENYLIST"' EXIT
            umask 077
            printf '%s\n' "$DENYLIST_CONTENT" > "$CREW_DENYLIST"
          fi
          unset DENYLIST_CONTENT
          python3 scripts/check-repo.py
      - name: Test suite (every scripts/test-*.py once, in parallel)
        run: python3 scripts/run-tests.py
