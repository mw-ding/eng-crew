# tmux profile example (roadmap 14.8, #137): layered on profiles/default.toml
# by `crew-config.py resolve`; only the keys below differ. One GitHub identity
# for every role, so verdicts are emulated (docs/interfaces.md, single-identity
# profile). Role names are the tmux window names (docs/runtimes/tmux.md).
# Renders templates/runtimes/tmux/ into the coordinator and role briefs.

[runtime]
name = "tmux"
# Role windows run any command in their worktree without asking (the default;
# "auto" or "safe" keep the harness's approval checks): docs/runtimes/tmux.md.
# Two researcher sessions, so a triage sweep never blocks a deep dive (#748).
options = { permission_mode = "bypass", researchers = 2 }

[backends.review]
name = "github"
capabilities = { post-verdict = "emulated (COMMENT-review verdict + recorded owner merge-ok)" }

[identities]
coordinator = { gh_user = "<author-login>", name = "Ash" }
builder = { gh_user = "<author-login>", name = "Ben" }
reviewer = { gh_user = "<author-login>", name = "Vera" }
synthesizer = { gh_user = "<author-login>", name = "Sam" }
researcher = { gh_user = "<author-login>", name = "Riley", title = "Researcher", emoji = "🔬" }

# Research row (docs/roles.md Current routing); mdstack spawn researcher runs at deep tier (#584).
[engines.roles]
researcher = { order = ["codex/gpt-6.1-sol", "claude-code/opus", "opencode/deepseek/deepseek-v4-pro"] }

# Default layout (docs/runtimes/tmux.md#home-level-layout-1178, #1316): every
# installed piece under one ~/.mdstack/ root, with only the repo checkout
# outside it. Save this file as ~/.mdstack/config.toml (the user-level config
# every command uses without --project) and uncomment the block with your
# repo; the example renders keep it commented so their output stays
# machine-independent. `mdstack bootstrap` proposes the same block.
# [paths]
# root = "~/.mdstack"
# state_dir = "state"
# worktree_root = "runs/<repo>"
# live_dir = "live"
# mdstack = "state/<owner>__<repo>/mdstack"
# checkout = "~/<repo>"
