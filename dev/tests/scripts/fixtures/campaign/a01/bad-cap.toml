# M25 A01 project layer over core, default and org/profile.toml. Paths are never written.
[repo]
owner = "campaign"
name = "a01"

[runtime.options]
builders = 2

[engines.default]
order = ["claude-code/sonnet"]

[flavor]
name = "standard"

[paths]
state_dir = "/campaign-a01/state"
worktree_root = "/campaign-a01/wt"
live_dir = "/campaign-a01/live"
mdstack = "/campaign-a01/mdstack"
toolchain_bin = "/usr/bin"

# Malformed capability: refused before any write.
[backends.review.capabilities]
post-verdict = "maybe"
